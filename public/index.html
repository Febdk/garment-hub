<!doctype html>
<html lang="id" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>GCWH — Garment Carton &amp; Warehouse Hub</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              ink: {
                50: "#f8fafc",
                100: "#f1f5f9",
                200: "#e2e8f0",
                300: "#cbd5e1",
                400: "#94a3b8",
                500: "#64748b",
                600: "#475569",
                700: "#334155",
                800: "#1e293b",
                900: "#0f172a",
              },
              paper: { 50: "#ffffff", 100: "#f8fafc", 200: "#f1f5f9" },
              hazard: {
                50: "#eff6ff",
                100: "#dbeafe",
                300: "#93c5fd",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
              },
              alarm: {
                50: "#fff1f2",
                100: "#ffe4e6",
                300: "#fda4af",
                500: "#f43f5e",
                600: "#e11d48",
                700: "#be123c",
              },
              stamp: {
                50: "#ecfdf5",
                100: "#d1fae5",
                300: "#6ee7b7",
                500: "#10b981",
                600: "#059669",
                700: "#047857",
              },
            },
            fontFamily: {
              display: ['"Inter"', "sans-serif"],
              sans: ['"Inter"', "sans-serif"],
              mono: ['"Fira Code"', "monospace"],
            },
          },
        },
      };
    </script>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <!-- Fonts + custom design tokens -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
    />
    <meta name="theme-color" content="#0b0d11" />
    <link rel="stylesheet" href="/css/theme.css" />
  </head>
  <body
    class="bg-paper-50 dark:bg-ink-900 text-ink-800 dark:text-ink-100 antialiased min-h-screen transition-colors duration-300"
  >
    <div id="app" v-cloak class="min-h-screen flex flex-col">
      <!-- Header Bar -->
      <header-bar
        :is-dark-mode="isDarkMode"
        :active-tab="activeTab"
        :current-user="currentUser"
        @toggle-theme="toggleTheme"
        @open-logo="showLogoModal = true"
        @open-user-modal="showUserModal = true"
        @open-audit-trail="showAuditTrailModal = true"
        @logout="logout"
        @update:active-tab="activeTab = $event"
      ></header-bar>

      <main
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6"
      >
        <!-- NOTIFICATION BANNER -->
        <transition
          enter-active-class="transition duration-300 ease-out"
          enter-from-class="opacity-0 -translate-y-2"
          leave-active-class="transition duration-200 ease-in"
          leave-to-class="opacity-0 -translate-y-2"
        >
          <div
            v-if="message"
            class="p-4 rounded-xl bg-stamp-50 dark:bg-stamp-700/20 text-stamp-700 dark:text-stamp-300 border border-stamp-200 dark:border-stamp-700 shadow-sm flex items-center justify-between no-print"
          >
            <div
              class="flex items-center gap-2 text-sm font-data font-semibold"
            >
              <span
                class="stamp border-stamp-600 text-stamp-600 dark:text-stamp-300"
                >OK</span
              >
              <span>{{ message }}</span>
            </div>
            <button
              @click="message = ''"
              class="text-stamp-500 hover:text-stamp-700 font-bold"
            >
              ✕
            </button>
          </div>
        </transition>

        <!-- KARTU STATISTIK (Disembunyikan saat Print) -->
        <div class="no-print">
          <stats-cards
            :stats="stats"
            :critical-count="criticalPOs.length"
            @toggle-urgent="filterUrgentOnly = !filterUrgentOnly"
          ></stats-cards>
        </div>

        <div class="workspace">
          <aside class="rail">
            <div class="no-print">
              <critical-panel
                :critical-pos="criticalPOs"
                :filter-urgent-only="filterUrgentOnly"
                @toggle-urgent="filterUrgentOnly = !filterUrgentOnly"
                @open-inspection="openInspectionModalForPO"
                @open-drawer="openPoDrawer"
              ></critical-panel>
            </div>
            <div v-if="activeTab === 'admin'" class="admin-form-wrap no-print">
              <input
                type="checkbox"
                id="admin-form-toggle"
                class="admin-toggle"
                aria-label="Buka form tambah PO"
              />
              <label for="admin-form-toggle" class="admin-fab"
                >+ Tambah PO</label
              >
              <label for="admin-form-toggle" class="admin-scrim"></label>
              <div class="admin-form-body">
                <label for="admin-form-toggle" class="admin-close"
                  ><span>Form PO Baru</span><span>Tutup &#10005;</span></label
                >
                <admin-form
                  :buyers="buyers"
                  :form="form"
                  @submit="submitPO"
                ></admin-form>
              </div>
            </div>
          </aside>
          <section class="main-col space-y-6">
            <div class="no-print">
              <filter-toolbar
                :search="searchQuery"
                :buyer="selectedBuyerFilter"
                :status="selectedStatusFilter"
                :date="selectedDateFilter"
                :buyers="buyers"
                :show-reset="hasActiveFilters"
                @update:search="searchQuery = $event"
                @update:buyer="selectedBuyerFilter = $event"
                @update:status="selectedStatusFilter = $event"
                @update:date="selectedDateFilter = $event"
                @reset="resetFilters"
              ></filter-toolbar>
            </div>

            <!-- TAB 1: HELPER BOY DASHBOARD -->
            <div v-if="activeTab === 'helper'" class="space-y-4 no-print">
              <div class="flex justify-between items-center">
                <h2
                  class="font-display text-lg font-bold text-ink-900 dark:text-white"
                >
                  Penempatan Rak &amp; Fisik Karton Gudang
                </h2>
                <span class="text-xs font-data text-ink-400 font-medium"
                  >Menampilkan {{ filteredPOs.length }} PO</span
                >
              </div>

              <!-- SKELETON LOADER KETIKA MEMUAT DATA -->
              <skeleton-loader v-if="isLoading"></skeleton-loader>

              <!-- KONDISI KETIKA DATA KOSONG -->
              <div
                v-else-if="filteredPOs.length === 0"
                class="bg-white dark:bg-ink-800 rounded-2xl p-12 text-center border border-ink-200 dark:border-ink-600 shadow-sm"
              >
                <p class="tag border-2 text-ink-400 inline-flex mb-3">KOSONG</p>
                <p class="text-ink-600 dark:text-ink-300 font-semibold">
                  Tidak ada PO yang ditemukan
                </p>
                <p class="text-xs text-ink-400 mt-1">
                  Coba sesuaikan kata kunci pencarian atau filter Buyer Anda.
                </p>
              </div>

              <!-- GRID DATA ASLI -->
              <div v-else class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <po-card
                  v-for="po in filteredPOs"
                  :key="po.id"
                  :po="po"
                  @open-placement="openPlacementModal"
                  @open-drawer="openPoDrawer"
                ></po-card>
              </div>
            </div>

            <!-- TAB 2: ADMIN RECORD DASHBOARD -->
            <div v-if="activeTab === 'admin'" class="space-y-4">
              <!-- ===== NAVIGASI SUB-TAB ADMIN ===== -->
              <div
                class="no-print -mx-4 sm:mx-0 overflow-x-auto pb-2 mb-2 scrollbar-hide"
              >
                <div class="flex gap-2 px-4 sm:px-0 w-max">
                  <button
                    @click="adminSubTab = 'active'"
                    :class="adminSubTab === 'active' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white dark:bg-ink-800 text-ink-600 dark:text-ink-300 border border-ink-200 dark:border-ink-600 hover:bg-ink-50 dark:hover:bg-ink-700'"
                    class="px-4 py-2.5 rounded-xl font-bold font-mono text-[11px] uppercase tracking-wider transition-all flex items-center gap-2"
                  >
                    Active
                    <span
                      :class="adminSubTab === 'active' ? 'bg-indigo-500' : 'bg-ink-200 dark:bg-ink-700 text-ink-600 dark:text-ink-400'"
                      class="px-1.5 py-0.5 rounded text-[10px]"
                    >
                      {{ activePOsCount || 0 }}
                    </span>
                  </button>
                  <button
                    @click="adminSubTab = 'overdue'"
                    :class="adminSubTab === 'overdue' ? 'bg-alarm-600 text-white shadow-md' : 'bg-white dark:bg-ink-800 text-ink-600 dark:text-ink-300 border border-ink-200 dark:border-ink-600 hover:bg-ink-50 dark:hover:bg-ink-700'"
                    class="px-4 py-2.5 rounded-xl font-bold font-mono text-[11px] uppercase tracking-wider transition-all flex items-center gap-2"
                  >
                    Overdue
                    <span
                      :class="adminSubTab === 'overdue' ? 'bg-alarm-500' : 'bg-ink-200 dark:bg-ink-700 text-ink-600 dark:text-ink-400'"
                      class="px-1.5 py-0.5 rounded text-[10px]"
                    >
                      {{ overduePOsCount || 0 }}
                    </span>
                  </button>
                  <button
                    @click="adminSubTab = 'shipped'"
                    :class="adminSubTab === 'shipped' ? 'bg-stamp-600 text-white shadow-md' : 'bg-white dark:bg-ink-800 text-ink-600 dark:text-ink-300 border border-ink-200 dark:border-ink-600 hover:bg-ink-50 dark:hover:bg-ink-700'"
                    class="px-4 py-2.5 rounded-xl font-bold font-mono text-[11px] uppercase tracking-wider transition-all flex items-center gap-2"
                  >
                    Shipped
                    <span
                      :class="adminSubTab === 'shipped' ? 'bg-stamp-500' : 'bg-ink-200 dark:bg-ink-700 text-ink-600 dark:text-ink-400'"
                      class="px-1.5 py-0.5 rounded text-[10px]"
                    >
                      {{ shippedPOsCount || 0 }}
                    </span>
                  </button>
                  <button
                    @click="adminSubTab = 'archive'"
                    :class="adminSubTab === 'archive' ? 'bg-ink-600 text-white shadow-md' : 'bg-white dark:bg-ink-800 text-ink-600 dark:text-ink-300 border border-ink-200 dark:border-ink-600 hover:bg-ink-50 dark:hover:bg-ink-700'"
                    class="px-4 py-2.5 rounded-xl font-bold font-mono text-[11px] uppercase tracking-wider transition-all flex items-center gap-2"
                  >
                    Archive
                    <span
                      :class="adminSubTab === 'archive' ? 'bg-ink-500' : 'bg-ink-200 dark:bg-ink-700 text-ink-600 dark:text-ink-400'"
                      class="px-1.5 py-0.5 rounded text-[10px]"
                    >
                      {{ archivedPOsCount || 0 }}
                    </span>
                  </button>
                </div>
              </div>
              <!-- =================================== -->

              <div>
                <!-- Tabel Master PO (INI YANG AKAN TAMPIL BERSIH SAAT DICETAK) -->
                <po-table
                  :pos="filteredPOs"
                  :active-sub-tab="adminSubTab"
                  @edit="openEditModal"
                  @delete="deletePO"
                  @status-change="handleStatusChange"
                  @open-inspection="openInspectionModalForPO"
                  @export-excel="exportToExcel"
                  @print-pdf="printReport"
                  @open-drawer="openPoDrawer"
                ></po-table>
              </div>
            </div>
          </section>
        </div>
      </main>

      <!-- MODALS -->
      <inspection-modal
        :show="showInspectionModal"
        :inspection-form="inspectionForm"
        @close="showInspectionModal = false"
        @submit="submitInspection"
      ></inspection-modal>

      <logo-modal
        :show="showLogoModal"
        :buyers="buyers"
        @close="showLogoModal = false"
        @update-logo="openUpdateLogoPrompt"
      ></logo-modal>

      <edit-modal
        :show="showEditModal"
        :buyers="buyers"
        :edit-form="editForm"
        @close="showEditModal = false"
        @save="saveEditPO"
      ></edit-modal>

      <placement-modal
        :show="showPlacementModal"
        :active-po="activePO"
        :active-color="activeColor"
        :placement-form="placementForm"
        @close="showPlacementModal = false"
        @save="savePlacement"
      ></placement-modal>

      <audit-trail-modal
        :show="showAuditTrailModal"
        @close="showAuditTrailModal = false"
      ></audit-trail-modal>

      <!-- ================= MODALS V6 ================= -->
      <po-detail-drawer
        :po="selectedPO"
        :is-open="showPoDrawer"
        @close="showPoDrawer = false"
        @open-carton-in="openCartonInModal"
        @open-carton-out="openCartonOutModal"
        @open-placement="openPlacementModal"
      ></po-detail-drawer>

      <carton-in-modal
        :po="selectedPO"
        :is-open="showCartonInModal"
        @close="showCartonInModal = false"
        @success="fetchData"
      ></carton-in-modal>

      <carton-out-modal
        :po="selectedPO"
        :is-open="showCartonOutModal"
        @close="showCartonOutModal = false"
        @success="fetchData"
      ></carton-out-modal>
      <!-- =========================================== -->

      <!-- MODAL LOGIN & USER MANAGEMENT -->
      <login-modal
        :show="showLoginModal"
        @login-success="onLoginSuccess"
      ></login-modal>

      <user-management-modal
        :show="showUserModal"
        @close="showUserModal = false"
      ></user-management-modal>
    </div>

    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .scrollbar-hide {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
    </style>

    <script type="module" src="/js/app.js"></script>
    <script>
      (function () {
        var raf = 0;
        function set() {
          raf = 0;
          var hd = document.querySelector("header");
          if (hd)
            document.documentElement.style.setProperty(
              "--hdr-h",
              hd.offsetHeight + "px",
            );
        }
        function q() {
          if (!raf) raf = requestAnimationFrame(set);
        }
        new MutationObserver(q).observe(document.body, {
          childList: true,
          subtree: true,
        });
        addEventListener("resize", q);
        q();
      })();
    </script>
  </body>
</html>
